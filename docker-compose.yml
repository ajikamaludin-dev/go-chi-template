services:
  web:
    build:
      context: .
      args:
        TARGET: web
        PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-chi-go-template}
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - ./storage/logs:/app/storage/logs
    depends_on:
      - mariadb
      - redis
    restart: unless-stopped

  worker:
    build:
      context: .
      args:
        TARGET: worker
        PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-chi-go-template}
    env_file: .env
    volumes:
      - ./storage/logs:/app/storage/logs
    depends_on:
      - mariadb
      - redis
    restart: unless-stopped

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: rootsecret
      MARIADB_DATABASE: app
      MARIADB_USER: app
      MARIADB_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped


volumes:
  mariadb_data:
  redis_data: